name: release-jar

on:
  push:
    branches: [ build-263 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle build
        run: ./gradlew build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la build/libs
          TAG="voxy-26.3-${GITHUB_SHA::7}"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" --prerelease \
            --title "Voxy for Minecraft 26.3 (unofficial build of branch 263 @ ${GITHUB_SHA::7})" \
            --notes "Built from upstream MCRcortex/voxy branch 263. Requires Sodium mc26.3-0.9.3-alpha.1. Back up your Voxy LOD data first."
